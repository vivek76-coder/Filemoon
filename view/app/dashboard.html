<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Filemoon Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css" rel="stylesheet" />
    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
          font-family: 'Inter', sans-serif;
        }
        body {
          overscroll-behavior: none;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.31.0/moment.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              surface: "#f8f9ff",
              "surface-dim": "#cbdbf5",
              "surface-bright": "#f8f9ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#eff4ff",
              "surface-container": "#e5eeff",
              "surface-container-high": "#dce9ff",
              "surface-container-highest": "#d3e4fe",
              "on-surface": "#0b1c30",
              "on-surface-variant": "#464555",
              primary: "#4f46e5",
              "primary-container": "#4338ca",
              "on-primary": "#ffffff",
              secondary: "#712ae2",
              tertiary: "#0284c7",
              error: "#ba1a1a",
              border: "#e2e8f0",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-surface text-on-surface min-h-screen antialiased flex">
    <!-- Persistent Left Sidebar -->
    <aside class="fixed left-0 top-0 bottom-0 bg-surface-container-lowest border-r border-slate-200/80 z-50 flex flex-col justify-between select-none overflow-hidden" style="width: 0px; transition: 0.3s;" id="sidebar">
      <div class="flex flex-col">
        <!-- Logo & Branding -->
        <div class="h-16 px-5 flex items-center justify-between border-b border-slate-100">
          <div class="flex items-center gap-2.5">
            <i class="ri-contrast-2-fill text-4xl text-violet-700"></i>
            <span class="font-bold text-lg tracking-tight text-slate-900">Filemoon</span>
          </div>
          <button
            class="flex items-center justify-center p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-colors"
            title="Collapse sidebar"
            type="button"
            onclick="toggleSidebar()"
          >
            <span class="material-symbols-outlined text-[18px]">keyboard_double_arrow_left</span>
          </button>
        </div>

        <!-- User Profile Card -->
        <div class="p-4">
          <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-100 flex items-center gap-3">
            <button onclick="uploadImage()">
              <img id="pic"
                class="w-9 h-9 rounded-full object-cover ring-2 ring-white shadow-xs"
                src="https://lh3.googleusercontent.com/aida/AEtjO1WQSyAPZsgJpBVQEjur6PVaFX5bZlRAUfUDFiOvlsQXF7HQ_ptazbAyACQM-A8fEtIBCAwij6bw3KoSWJheSq0Lig4hsC6TDyQvMNWbtsoUr_RJcLM0ase9WCqlXpXgTNZCcV2EI4HCpoID_-g80Khz3ouwY-ZrFe8vdpmtydv4GAb9rCNylyPaBDSFElriFqeCpAUtDpcWpnw5GRkXhTKtuP40ngJP3y5EKEEXbpJTQEeF9GvE9wH2vC0"
              />
            </button>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold truncate text-slate-800 leading-tight" id="fullname"></div>
              <div class="text-xs text-slate-500 truncate mt-0.5" id="email"></div>
            </div>
          </div>
        </div>

        <!-- Navigation Links -->
        <nav class="flex flex-col gap-1 px-3 mt-1">
          <a
            aria-current="page"
            class="flex items-center justify-between px-3 py-2 rounded-lg bg-indigo-600 text-white font-medium text-sm shadow-sm transition-colors"
            href="/dashboard"
          >
            <div class="flex items-center gap-2.5">
              <span class="material-symbols-outlined text-[19px]">grid_view</span>
              <span>Dashboard</span>
            </div>
            <span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-indigo-700/60 text-indigo-100">⌘1</span>
          </a>

          <a
            class="flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium text-sm transition-colors"
            href="/files"
          >
            <div class="flex items-center gap-2.5">
              <span class="material-symbols-outlined text-[19px]">folder</span>
              <span>My Files</span>
            </div>
            <span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">⌘2</span>
          </a>

          <a
            class="flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium text-sm transition-colors"
            href="/history"
          >
            <div class="flex items-center gap-2.5">
              <span class="material-symbols-outlined text-[19px]">schedule</span>
              <span>Recent History</span>
            </div>
            <span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">⌘3</span>
          </a>
        </nav>
      </div>

      <!-- Bottom Logout -->
      <div class="p-3 border-t border-slate-100">
        <button
          class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-rose-50 hover:text-rose-600 font-medium text-sm transition-colors group"
          type="button"
          onclick="logout()"
        >
          <div class="flex items-center gap-2.5">
            <span class="material-symbols-outlined text-[19px] group-hover:text-rose-600">logout</span>
            <span>Log out</span>
          </div>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class=" flex flex-col flex-1 min-h-screen">
      <!-- Top Navbar -->
      <header class="fixed w-full top-0 h-16 bg-white/90 backdrop-blur-md border-b border-slate-200/80 z-1000 px-8 flex items-center justify-between gap-4">
        <a href="/dashboard">
          <div class="flex items-center gap-3 flex-1 max-w-md">
            <i class="ri-contrast-2-fill text-4xl text-violet-700"></i>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Filemoon</h1>
          </div>
        </a>

        <div class="flex items-center gap-2.5 flex-wrap">
          
          <div class="h-5 w-px bg-slate-200 mx-1"></div>

          <div class="flex  items-center gap-2 w-[60%]">
              <button
                class="flex  items-center gap-2 p-1 pl-1.5 pr-2 rounded-full hover:bg-slate-100 transition-colors focus:outline-none"
                type="button"
                onclick="toggleProfileToast()"
              >
                <img
                  id="pic"
                  alt="Alex Morgan"
                  class="w-7 h-7 rounded-full object-cover"
                  src="https://lh3.googleusercontent.com/aida/AEtjO1WQSyAPZsgJpBVQEjur6PVaFX5bZlRAUfUDFiOvlsQXF7HQ_ptazbAyACQM-A8fEtIBCAwij6bw3KoSWJheSq0Lig4hsC6TDyQvMNWbtsoUr_RJcLM0ase9WCqlXpXgTNZCcV2EI4HCpoID_-g80Khz3ouwY-ZrFe8vdpmtydv4GAb9rCNylyPaBDSFElriFqeCpAUtDpcWpnw5GRkXhTKtuP40ngJP3y5EKEEXbpJTQEeF9GvE9wH2vC0"
                />
                <span class="text-xs font-medium text-slate-700" id="fullname"></span>
                  <span class="material-symbols-outlined text-[16px] text-slate-400">expand_more</span>
              </button>
              
            </div>
            
            <button class="w-8 h-8 bg-indigo-100 rounded active:bg-indigo-200" onclick="toggleSidebar()"><i class="ri-menu-line"></i></button>
            
            <div class="hidden flex justify-center items-center absolute z-[100000] top-16 right-8 shadow-lg border border-gray-300 rounded-xl w-[150px] h-16 bg-white/90 backdrop-blur-md" id="profileToast">
              <button
                class="px-3 py-2 rounded-lg text-slate-600 hover:bg-rose-50 hover:text-rose-600 font-medium text-sm transition-colors group"
                type="button"
                onclick="logout()">
                  <div class="flex items-center gap-2.5">
                    <span class="material-symbols-outlined text-[19px] group-hover:text-rose-600">logout</span>
                    <span>Log out</span>
                  </div>
              </button>
            </div>
          </div>
      </header>

      <!-- Main Body Container -->
      <main class="w-full pt-16 flex-1 px-8 py-6">
        <div class="max-w-7xl mx-auto flex flex-col gap-6">

          <!-- Welcome & Primary Actions Bar -->
          <section class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex flex-col gap-1">
              <div class="flex items-center gap-2">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight" id="fullname">

                </h1>
                <span class="text-xl">👋</span>
              </div>
              <p class="text-sm text-slate-500">
                Here is what is happening with your cloud storage and shared workspaces today.
              </p>
            </div>

            <div class="flex items-center flex-wrap gap-2.5">
              <button
                class="inline-flex items-center gap-2 px-3.5 h-9 rounded-lg bg-white border border-slate-200 text-slate-700 font-medium text-sm shadow-xs hover:bg-slate-50 hover:border-slate-300 transition-all"
                type="button"
              >
                <span class="material-symbols-outlined text-[18px] text-indigo-600">create_new_folder</span>
                <span>New Folder</span>
              </button>

              <button
                class="inline-flex items-center gap-2 px-3.5 h-9 rounded-lg bg-white border border-slate-200 text-slate-700 font-medium text-sm shadow-xs hover:bg-slate-50 hover:border-slate-300 transition-all"
                type="button"
              >
                <span class="material-symbols-outlined text-[18px] text-purple-600">link</span>
                <span>Share Link</span>
              </button>

            </div>
          </section>

          <!-- Quick Category Bar -->
          <section class="grid grid-cols-2 md:grid-cols-4 gap-4" id="report-card">

          </section>

          <!-- Two-Column Core Layout: Recent Files (7) & Recent Shared (5) -->
          <section class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Left Column: Recent Files (7 Cols) -->
            <div class="lg:col-span-7 bg-white rounded-xl border border-slate-200/80 shadow-xs p-5 flex flex-col gap-4">
              <!-- Files Header -->
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                <div>
                  <h2 class="text-base font-bold text-slate-900 tracking-tight">
                      Recent Files
                  </h2>
                  <span class="text-xs text-slate-500">Direct edits & uploads across your workspaces</span>
                </div>
                <div class="flex items-center gap-3">
                  <div class="flex bg-slate-100 p-0.5 rounded-lg">
                    <button
                      class="px-2.5 py-1 rounded-md text-xs font-semibold bg-white text-slate-900 shadow-xs"
                      type="button"
                    >
                      All
                    </button>
                    <button
                      class="px-2.5 py-1 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 transition-colors"
                      type="button"
                    >
                      Docs
                    </button>
                    <button
                      class="px-2.5 py-1 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 transition-colors"
                      type="button"
                    >
                      Media
                    </button>
                  </div>
                  <a href="/files"
                    class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 transition-colors"
                    type="button"
                  >
                    View All
                  </a>
                </div>
              </div>

              <!-- File List -->
              <div class="flex flex-col gap-2.5" id="recent-files-box">

              </div>
            </div>

            <!-- Right Column: Recent Shared (5 Cols) -->
            <div class="lg:col-span-5 bg-white rounded-xl border border-slate-200/80 shadow-xs p-5 flex flex-col gap-4">
              <!-- Shared Header -->
              <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div>
                  <h2 class="text-base font-bold text-slate-900 tracking-tight">
                    <a href="/history">
                      Recent Shared
                    </a>
                  </h2>
                  <span class="text-xs text-slate-500">External links & collaborators</span>
                </div>
                <button
                  class="inline-flex items-center gap-1 text-xs font-semibold text-indigo-600 hover:text-indigo-700 transition-colors"
                  type="button"
                >
                  <a href="/history">View All</a>
                  <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
                </button>
              </div>

              <!-- Shared Items List -->
              <div class="flex flex-col gap-2.5" id="recent-shared-box">

              </div>
            </div>

          </section>

        </div>
      </main>
    </div>

    <!-- Script for Dropdown -->
    <script>
      const uploadBtn = document.getElementById("uploadDropdownBtn");
      const uploadMenu = document.getElementById("uploadDropdownMenu");

      if (uploadBtn && uploadMenu) {
        uploadBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          uploadMenu.classList.toggle("hidden");
          uploadMenu.classList.toggle("flex");
        });

        document.addEventListener("click", (e) => {
          if (!uploadMenu.contains(e.target) && !uploadBtn.contains(e.target)) {
            uploadMenu.classList.add("hidden");
            uploadMenu.classList.remove("flex");
          }
        });
      }
    </script>
    <script src="../js/env.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>

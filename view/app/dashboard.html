<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

</head>
<body >
    <div class="bg-gray-100 h-screen">
        <aside class="space-y-6 py-6 bg-gradient-to-r from-cyan-500 to-blue-500 fixed top-0 left-0 h-full" id="sidebar" style="width: 250px; transition: 0.3s;">
            <!-- profile-section -->
            <div class="flex flex-col items-center">
                <img src="../images/avt.png" alt="" width="80">
                <h1 class="text-lg font-medium text-white">Er saurav</h1>
                <p class="text-sm text-gray-100">saurav@gmail.com</p>
            </div>
            <!-- lists -->
             <div class="px-6 flex flex-col gap-4" >
                <a href="#">
                    <button class="w-full bg-rose-400 text-white py-2.5 rounded hover:bg-rose-600">
                    <i class="ri-apps-line"></i>
                    <label for="dashboard">dashboard</label>
                    </button>
                </a>
                <a href="#">
                    <button class="w-full bg-rose-400 text-white py-2.5 rounded hover:bg-rose-600">
                    <i class="ri-file-line"></i>
                    <label for="dashboard">My Files</label>
                    </button>
                </a>
                <a href="#">
                    <button class="w-full bg-rose-400 text-white py-2.5 rounded hover:bg-rose-600">
                    <i class="ri-history-line"></i>
                    <label for="dashboard">History</label>
                    </button>
                </a>

                <button class="w-full bg-rose-400 text-white py-2.5 rounded hover:bg-rose-600">
                    <i class="ri-logout-circle-r-line"></i>
                    <label for="logout">logout</label>
                </button>
             </div>
        </aside>
    </div>
    <script src="../js/layout.js"></script>
</body>
</html>
